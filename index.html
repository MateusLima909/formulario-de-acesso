<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao setor</title>
    
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="static/estilo.css">
    
    <link rel="icon" href="assets/id-card.png" type="image/png">
</head>

<body class="layout-login">

    <label class="switch" id="theme-toggle-label" title="Alternar Tema Claro/Escuro">
        <input checked="true" id="checkbox" type="checkbox" />
        <span class="slider">
            <div class="star star_1"></div>
            <div class="star star_2"></div>
            <div class="star star_3"></div>
            <svg viewBox="0 0 16 16" class="cloud_1 cloud">
                <path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff"
                    d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925">
                </path>
            </svg>
        </span>
    </label>

    <div class="side-content">
        <h1 id="texto-lateral">Flow<span>Auth</span></h1>
        <p id="subtexto-lateral">Gestão de Acesso Inteligente</p>
    </div>

    <div id="container-login" class="form-container">
        <form id="formLogin">
            <h2>Login</h2>
            <hr class="hr-gradiente">

            <div class="input-group">
                <label for="email-login">E-mail</label>
                <div class="input-wrapper">
                    <i data-feather="mail" class="icon-field"></i>
                    <input type="email" id="email-login" name="email-login" placeholder="Digite seu E-mail...">
                </div>
                <span class="msg-erro"></span>
            </div>

            <div class="input-group">
                <label for="senha-login">Senha</label>
                <div class="password-wrapper">
                    <i data-feather="lock" class="icon-field"></i>
                    <input type="password" class="input-senha" id="senha-login" name="senha-login"
                        placeholder="Digite a senha...">
                    <button type="button" class="btn-ver-senha" onclick="toggleSenha(this)">
                        <i data-feather="eye"></i>
                    </button>
                </div>
                <span class="msg-erro"></span>
            </div>

            <button type="submit">Acessar</button>
            <p>Não tem conta? <a href="#" id="ir-para-cadastro">Cadastre-se</a></p>
        </form>
    </div>

    <div id="container-cadastro" class="form-container hidden">
        <form id="formCadastro">
            <h2>Cadastro</h2>
            <hr class="hr-gradiente">

            <div class="input-group">
                <label for="nome-cadastro">Nome Completo</label>
                <div class="input-wrapper">
                    <i data-feather="user" class="icon-field"></i>
                    <input type="text" id="nome-cadastro" name="nome-cadastro"
                        oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')"
                        placeholder="Seu nome completo..">
                </div>
                <span class="msg-erro"></span>
            </div>

            <div class="input-group">
                <label for="email-cadastro">E-mail</label>
                <div class="input-wrapper">
                    <i data-feather="mail" class="icon-field"></i>
                    <input type="email" id="email-cadastro" name="email-cadastro" placeholder="Seu melhor E-mail...">
                </div>
                <span class="msg-erro"></span>
            </div>

            <div class="input-group">
                <label for="senha-cadastro">Senha</label>
                <div class="password-wrapper">
                    <i data-feather="lock" class="icon-field"></i>
                    <input type="password" class="input-senha" id="senha-cadastro" name="senha-cadastro"
                        placeholder="Crie uma senha...">
                    <button type="button" class="btn-ver-senha" onclick="toggleSenha(this)">
                        <i data-feather="eye"></i>
                    </button>
                </div>
                <span class="msg-erro"></span>
            </div>

            <div class="input-group">
                <label for="confirmaSenha">Confirmar Senha</label>
                <div class="password-wrapper">
                    <i data-feather="shield" class="icon-field"></i>
                    <input type="password" class="input-senha" id="confirmaSenha" name="confirmaSenha"
                        placeholder="Repita a senha...">
                    <button type="button" class="btn-ver-senha" onclick="toggleSenha(this)">
                        <i data-feather="eye"></i>
                    </button>
                </div>
                <span class="msg-erro"></span>
            </div>

            <button type="submit">Cadastrar</button>
            <p>Já tem conta? <a href="#" id="ir-para-login">Faça Login</a></p>
        </form>
    </div>

    <script src="script/script.js" defer></script>
</body>
</html>
