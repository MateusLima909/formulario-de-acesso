<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="estilo.css">
    <title>Acesso ao setor</title>
    <link rel="icon" href="assets/id-card.png" type="image/png">
</head>
<body class="layout-login">

    <div class="side-content">
        <h1 id="texto-lateral">Flow<span>Auth</span></h1>
        <p id="subtexto-lateral">Gestão de Acesso Inteligente</p>
    </div>

    <div id="container-login" class="form-container">
        <form id="formLogin">
            <h2>Login</h2>
            <hr class="hr-gradiente">
            
            <div class="input-group"> 
                <label for="email-login">E-mail</label>
                <div class="input-wrapper">
                    <i data-feather="mail" class="icon-field"></i>
                    <input type="email" id="email-login" name="email-login" placeholder="Digite seu E-mail...">
                </div>
                <span class="msg-erro"></span>
            </div>
            
            <div class="input-group"> 
                <label for="senha-login">Senha</label>
                <div class="password-wrapper">
                    <i data-feather="lock" class="icon-field"></i>
                    <input type="password" class="input-senha" id="senha-login" name="senha-login" placeholder="Digite a senha...">
                    <button type="button" class="btn-ver-senha" onclick="toggleSenha(this)">
                        <i data-feather="eye"></i>
                    </button>
                </div>
                <span class="msg-erro"></span>
            </div>
            
            <button type="submit">Acessar</button>
            <p>Não tem conta? <a href="#" id="ir-para-cadastro">Cadastre-se</a></p>
        </form> 
    </div>

    <div id="container-cadastro" class="form-container hidden">
        <form id="formCadastro">
            <h2>Cadastro</h2>
            <hr class="hr-gradiente">
            
            <div class="input-group"> 
                <label for="nome-cadastro">Nome Completo</label>
                <div class="input-wrapper">
                    <i data-feather="user" class="icon-field"></i>
                    <input type="text" id="nome-cadastro" name="nome-cadastro" 
                           oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')" 
                           placeholder="Seu nome completo..">
                </div>
                <span class="msg-erro"></span>
            </div>

            <div class="input-group"> 
                <label for="email-cadastro">E-mail</label>
                <div class="input-wrapper">
                    <i data-feather="mail" class="icon-field"></i>
                    <input type="email" id="email-cadastro" name="email-cadastro" placeholder="Seu melhor E-mail...">
                </div>
                <span class="msg-erro"></span>
            </div>
            
            <div class="input-group"> 
                <label for="senha-cadastro">Senha</label>
                <div class="password-wrapper">
                    <i data-feather="lock" class="icon-field"></i>
                    <input type="password" class="input-senha" id="senha-cadastro" name="senha-cadastro" placeholder="Crie uma senha...">
                    <button type="button" class="btn-ver-senha" onclick="toggleSenha(this)">
                        <i data-feather="eye"></i>
                    </button>
                </div>
                <span class="msg-erro"></span>
            </div>

            <div class="input-group"> 
                <label for="confirmaSenha">Confirmar Senha</label>
                <div class="password-wrapper">
                    <i data-feather="shield" class="icon-field"></i>
                    <input type="password" class="input-senha" id="confirmaSenha" name="confirmaSenha" placeholder="Repita a senha...">
                    <button type="button" class="btn-ver-senha" onclick="toggleSenha(this)">
                        <i data-feather="eye"></i>
                    </button>
                </div>
                <span class="msg-erro"></span>
            </div>
            
            <button type="submit">Cadastrar</button>
            <p>Já tem conta? <a href="#" id="ir-para-login">Faça Login</a></p>
        </form> 
    </div>

    <script>
        feather.replace();

        const formLogin = document.getElementById('formLogin');
        const formCadastro = document.getElementById('formCadastro');

        formLogin.addEventListener('submit', function(evento) {
            evento.preventDefault();
            validarCamposLogin();
        });

        formCadastro.addEventListener('submit', function(evento) {
            evento.preventDefault();
            validarCamposCadastro();
        });

        const loginLink = document.getElementById('ir-para-cadastro');
        const cadastroLink = document.getElementById('ir-para-login');
        const subtexto = document.getElementById('subtexto-lateral');

        loginLink.addEventListener('click', function(e) {
            e.preventDefault();
            document.body.className = 'layout-cadastro';
            subtexto.textContent = "Crie sua conta agora";
            document.getElementById('container-login').classList.add('hidden');
            document.getElementById('container-cadastro').classList.remove('hidden');
        });

        cadastroLink.addEventListener('click', function(e) {
            e.preventDefault();
            document.body.className = 'layout-login';
            subtexto.textContent = "Gestão de Acesso Inteligente";
            document.getElementById('container-cadastro').classList.add('hidden');
            document.getElementById('container-login').classList.remove('hidden');
        });

        function validarCamposLogin() {
            const erros = document.querySelectorAll('.error');
            erros.forEach(el => el.classList.remove('error'));

            const inputEmail = document.getElementById('email-login');
            const inputSenha = document.getElementById('senha-login');
            const emailValue = inputEmail.value.trim();
            const senhaValue = inputSenha.value.trim();
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            let formularioValido = true;

            if (emailValue === "") {
                exibirErro(inputEmail, "O campo de e-mail não pode ser vazio.");
                formularioValido = false;
            } else if (!regex.test(emailValue)) {
                exibirErro(inputEmail, "O e-mail tem que ser válido.");
                formularioValido = false;
            }

            if (senhaValue.length < 8) {
                exibirErro(inputSenha, "A senha precisa ter no mínimo 8 caracteres.");
                formularioValido = false;
            }

            if (formularioValido) {
                alert("Login realizado com sucesso!");
            }
        }

         function validarCamposCadastro() {
            const erros = document.querySelectorAll('.error');
            erros.forEach(el => el.classList.remove('error'));
            
            const inputNome = document.getElementById('nome-cadastro');
            const inputEmail = document.getElementById('email-cadastro');
            const inputSenha = document.getElementById('senha-cadastro');
            const inputConfirmaSenha = document.getElementById('confirmaSenha');

            const nomeValue = inputNome.value.trim();
            const emailValue = inputEmail.value.trim();
            const senhaValue = inputSenha.value.trim();
            const confirmaSenhaValue = inputConfirmaSenha.value.trim();
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            let formularioValido = true;

            if (nomeValue === "") {
                exibirErro(inputNome, "O campo nome não pode ser vazio");
                formularioValido = false;
            } 

            if (emailValue === "") {
                exibirErro(inputEmail, "O campo de e-mail não pode ser vazio.");
                formularioValido = false;
            } else if (!regex.test(emailValue)) {
                exibirErro(inputEmail, "O e-mail tem que ser válido.");
                formularioValido = false;
            }

            if (senhaValue.length < 8) {
                exibirErro(inputSenha, "A senha precisa ter no mínimo 8 caracteres.");
                formularioValido = false;
            }

            if (senhaValue !== confirmaSenhaValue) {
                exibirErro(inputConfirmaSenha, "As senhas estão diferentes!");
                formularioValido = false;
            }

            if (formularioValido) {
                alert("Cadastro realizado com sucesso!");
            }
        }

        function toggleSenha(botao) {
            const input = botao.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                botao.innerHTML = '<i data-feather="eye-off"></i>';
            } else {
                input.type = 'password';
                botao.innerHTML = '<i data-feather="eye"></i>';
            }
            feather.replace();
        }

        // FUNÇÃO AUXILIAR DE ERRO
        function exibirErro(input, mensagem) {
            input.classList.add("error");

            const container = input.closest('.input-group');
            const spanErro = container.querySelector('.msg-erro');

            spanErro.textContent = mensagem;
        }
    </script>
</body>
</html>
