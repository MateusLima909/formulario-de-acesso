<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Acesso ao setor</title>
</head>
<body>
    <div id="container-login">
        <form id="formLogin">
            <h2>Login</h2>
            <hr class="hr-gradiente">
            
            <div class="input-group"> 
                <label for="email-login">E-mail</label>
                <input type="email" id="email-login" name="email-login" placeholder="Digite seu E-mail...">
                <span class="msg-erro"></span>
            </div>
            
            <div class="input-group"> 
                <label for="senha-login">Senha</label>
                <input type="password" id="senha-login" name="senha-login" placeholder="Digite sua senha..." required>
                <span class="msg-erro"></span>
            </div>
            
            <button type="submit">Acessar</button>
            <p>Não tem conta? <a href="#" id="ir-para-cadastro">Cadastre-se</a></p>
        </form> 
    </div>

    <div id="container-cadastro" class="hidden">
        <form id="formCadastro">
            <h2>Cadastro</h2>
            <hr class="hr-gradiente">
            
            <div class="input-group"> 
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome-cadastro" name="nome-cadastro" placeholder="Digite seu nome completo..">
                <span class="msg-erro"></span>
            </div>

            <div class="input-group"> 
                <label for="email-cadastro">E-mail</label>
                <input type="email" id="email-cadastro" name="email-cadastro" placeholder="Digite seu E-mail...">
                <span class="msg-erro"></span>
            </div>
            
            <div class="input-group"> 
                <label for="senha-cadastro">Senha</label>
                <input type="password" id="senha-cadastro" name="senha-cadastro" placeholder="Digite sua senha..." required>
                <span class="msg-erro"></span>
            </div>

            <div class="input-group"> 
                <label for="confirmaSenha">Confirmar Senha</label>
                <input type="password" id="confirmaSenha" name="confirmaSenha" placeholder="Digite sua senha novamente..." required>
                <span class="msg-erro"></span>
            </div>
            
            <button type="submit">Cadastrar</button>
            <p>Já tem conta? <a href="#" id="ir-para-login">Faça Login</a></p>
        </form> 
    </div>

    <script>
        const formLogin = document.getElementById('formLogin');
        const formCadastro = document.getElementById('formCadastro');
        // Evento de Envio
        formLogin.addEventListener('submit', function(evento) {
            evento.preventDefault();
            console.log("Tentei enviar, mas o js parou para validar!");
            validarCamposLogin();
        });

        const login = document.getElementById('ir-para-cadastro');
        const cadastro = document.getElementById('ir-para-login'); 
        
        const paginaLogin = document.getElementById('container-login');
        const paginaCadastro = document.getElementById('container-cadastro');

        login.addEventListener('click', function(evento) {
            evento.preventDefault();

            paginaLogin.classList.add('hidden');
            paginaCadastro.classList.remove('hidden');
        });

        cadastro.addEventListener('click', function(evento) {
            evento.preventDefault();

            paginaCadastro.classList.add('hidden');
            paginaLogin.classList.remove('hidden');
        });

        // Limpeza de erros em tempo real
        document.getElementById('email-login').addEventListener('input', function() {
            this.classList.remove('error');
        });

        document.getElementById('senha-login').addEventListener('input', function() {
            this.classList.remove('error');
        });

        // Lógica de Validação
        function validarCamposLogin() {
            const erros = document.querySelectorAll('.error');
            erros.forEach(el => el.classList.remove('error'));

            const inputEmail = document.getElementById('email-login');
            const inputSenha = document.getElementById('senha-login');

            const emailValue = inputEmail.value.trim();
            const senhaValue = inputSenha.value.trim();
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            let formularioValido = true;

            // Validação de Email
            if (emailValue == "") {
                exibirErro(inputEmail, "O campo de e-mail não pode ser vazio.");
                formularioValido = false;
            } else if (!regex.test(emailValue)) {
                exibirErro(inputEmail, "O e-mail tem que ser válido.");
                formularioValido = false;
            }

            // Validação de Senha
            if (senhaValue.length < 8) {
                exibirErro(inputSenha, "A senha precisa ter no mínimo 8 caracteres.");
                formularioValido = false;
            }

            if (formularioValido) {
                alert("Login realizado com sucesso!");
            }
        }

        // Função auxiliar de Erro
        function exibirErro(input, mensagem) {
            input.classList.add("error");
            const spanInput = input.nextElementSibling;
            spanInput.textContent = mensagem;
        }
    </script>
</body>
</html>
